<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<style>.t{font-size:19px;font-weight:700;fill:#1b2430}.sub{font-size:12.5px;fill:#5d6875}.h{font-size:14px;font-weight:700;fill:#1b2430}.n{font-size:12px;fill:#5d6875}.k{font-size:13px;fill:#26303c}.kb{font-size:13px;font-weight:700;fill:#1b2430}.v{font-size:12.5px;font-weight:700;fill:#1b2430}.good{font-size:12px;font-weight:700;fill:#1f7a3e}.bad{font-size:12px;font-weight:700;fill:#b23a2b}.ax{font-size:11px;fill:#7a8591}</style>
<rect width="1120" height="610" fill="#fbfcfd"/>
<text class="t" x="34" y="34">On-device TTS: streaming hides synthesis time, and accuracy is close to the system voice</text>
<text class="sub" x="34" y="55">Measured in the iOS simulator on an Apple-silicon Mac, 4 threads. Not yet measured on a physical device.</text>

<!-- Panel A: tap to first audio -->
<rect x="34" y="76" width="516" height="396" rx="6" fill="#ffffff" stroke="#e1e6ec"/>
<text class="h" x="52" y="104">Tap to first audio, one 987-word article</text>
<text class="n" x="52" y="123">Cache cleared each run. "Off" includes the first model load.</text>
<rect x="52" y="138" width="14" height="12" rx="2" fill="#c3cfdc"/>
<text class="n" x="72" y="149">streaming off: synthesize the whole article, then play</text>
<rect x="52" y="158" width="14" height="12" rx="2" fill="#2f6db5"/>
<text class="n" x="72" y="169">streaming on: play the first sentence while the rest synthesizes</text>

<text class="kb" x="52" y="214">iOS system voice</text>
<rect x="190" y="198" width="6" height="22" rx="2" fill="#c3cfdc"/>
<text class="v" x="202" y="214">3.55 s</text>
<rect x="190" y="226" width="2" height="22" rx="1" fill="#2f6db5"/>
<text class="v" x="198" y="242">0.19 s</text>

<text class="kb" x="52" y="300">Matcha + Vocos</text>
<rect x="190" y="284" width="17" height="22" rx="2" fill="#c3cfdc"/>
<text class="v" x="213" y="300">9.81 s</text>
<rect x="190" y="312" width="2" height="22" rx="1" fill="#2f6db5"/>
<text class="v" x="198" y="328">0.25 s</text>

<text class="kb" x="52" y="386">Kokoro</text>
<rect x="190" y="370" width="276" height="22" rx="2" fill="#c3cfdc"/>
<text class="v" x="472" y="386">164 s</text>
<rect x="190" y="398" width="8" height="22" rx="2" fill="#2f6db5"/>
<text class="v" x="204" y="414">4.82 s</text>

<line x1="190" y1="188" x2="190" y2="430" stroke="#c9d1da"/>
<text class="ax" x="190" y="448" text-anchor="middle">0</text>
<text class="ax" x="274" y="448" text-anchor="middle">50 s</text>
<text class="ax" x="358" y="448" text-anchor="middle">100 s</text>
<text class="ax" x="442" y="448" text-anchor="middle">150 s</text>

<!-- Panel B: WER -->
<rect x="570" y="76" width="516" height="396" rx="6" fill="#ffffff" stroke="#e1e6ec"/>
<text class="h" x="588" y="104">Word error rate, lower is better</text>
<text class="n" x="588" y="123">215 paragraphs from 50 news articles, transcribed back with Whisper small.en.</text>
<text class="n" x="588" y="141">The baseline mostly measures the transcriber and text normalization.</text>

<text class="kb" x="588" y="206">macOS voice</text>
<text class="n" x="588" y="222">(baseline)</text>
<rect x="740" y="194" width="196" height="26" rx="3" fill="#b9c2cc"/>
<text class="v" x="944" y="212">4.09%</text>

<text class="kb" x="588" y="280">Matcha + Vocos</text>
<rect x="740" y="262" width="239" height="26" rx="3" fill="#d08a2e"/>
<text class="v" x="987" y="280">4.97%</text>
<text class="bad" x="588" y="296">+0.88 pp vs baseline</text>

<text class="kb" x="588" y="348">Kokoro</text>
<rect x="740" y="330" width="192" height="26" rx="3" fill="#2f6db5"/>
<text class="v" x="940" y="348">4.00%</text>
<text class="good" x="588" y="364">−0.09 pp vs baseline</text>

<line x1="936" y1="182" x2="936" y2="372" stroke="#5d6875" stroke-dasharray="4 3"/>
<line x1="740" y1="182" x2="740" y2="380" stroke="#c9d1da"/>
<text class="ax" x="740" y="396" text-anchor="middle">0%</text>
<text class="ax" x="836" y="396" text-anchor="middle">2%</text>
<text class="ax" x="932" y="396" text-anchor="middle">4%</text>
<text class="ax" x="1028" y="396" text-anchor="middle">6%</text>
<text class="n" x="588" y="430">No engine skipped a sentence or made up content. Gaps under one</text>
<text class="n" x="588" y="447">point are within measurement noise.</text>

<!-- What the picture is for -->
<rect x="34" y="490" width="1052" height="96" rx="6" fill="#eef3f8" stroke="#c7d6e6"/>
<text class="kb" x="52" y="516">What the picture is for</text>
<text class="k" x="52" y="540">Kokoro needs ~0.5 s of compute per second of audio, so a whole article takes minutes; streaming cuts the wait to seconds.</text>
<text class="k" x="52" y="560">Matcha is ~20x faster but reads ~1 point less accurately and speaks ~22% slower. Kokoro's accuracy matches the system voice.</text>
</svg>
