<line x1="790.0" y1="198" x2="790.0" y2="316" stroke="#52514e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="790.0" y="190" font-size="16" fill="#52514e" text-anchor="middle">real time</text>
<text x="60" y="382" font-size="21" font-weight="700" fill="#0b0b0b">Audio produced from the same 215 paragraphs</text>
