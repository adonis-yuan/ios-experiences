<text x="84" y="658" font-size="20" fill="#0b0b0b">Slower speech means more audio, so more to synthesize, for the same text.</text>
<text x="84" y="688" font-size="20" fill="#0b0b0b">Benchmark whole articles, not sentences.</text>
<text x="60" y="746" font-size="16" fill="#8a8984">iOS simulator on an Apple-silicon Mac, 4 threads. Not yet measured on a physical device.</text>
