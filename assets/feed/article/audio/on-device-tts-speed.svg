<text x="60" y="70" font-size="34" font-weight="700" fill="#0b0b0b">Matcha synthesizes ~20× faster, but speaks 22% slower</text>
<text x="60" y="118" font-size="20" fill="#52514e">Real-time factor (RTF) = synthesis time ÷ audio length. Below 1 is faster than real time.</text>
<text x="60" y="186" font-size="21" font-weight="700" fill="#0b0b0b">RTF on 6 news sentences, lower is faster</text>
