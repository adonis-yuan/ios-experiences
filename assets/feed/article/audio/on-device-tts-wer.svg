<rect x="60" y="758" width="960" height="88" rx="8" fill="#f0efec"/>
<text x="84" y="798" font-size="20" fill="#0b0b0b">Gaps under one point are within measurement noise. No engine skipped a</text>
<text x="84" y="828" font-size="20" fill="#0b0b0b">sentence or made anything up; most errors are names, brands and numbers.</text>
<text x="60" y="886" font-size="16" fill="#8a8984">Synthesized on an Apple-silicon Mac. The baseline mostly measures the transcriber and normalization.</text>
</svg>