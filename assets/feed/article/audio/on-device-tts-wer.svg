<text x="880.0" y="478" font-size="16" fill="#8a8984" text-anchor="middle">6%</text>
<text x="60" y="261.0" font-size="19" font-weight="600" fill="#0b0b0b">macOS system voice</text>
<text x="60" y="283.0" font-size="16" fill="#52514e">baseline</text>
