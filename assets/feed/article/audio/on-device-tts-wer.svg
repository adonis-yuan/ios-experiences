<text x="718.0999999999999" y="271.0" font-size="20" font-weight="700" fill="#0b0b0b">4.09%</text>
<text x="60" y="341.0" font-size="19" font-weight="600" fill="#0b0b0b">Matcha + Vocos</text>
<text x="60" y="363.0" font-size="16" fill="#52514e">+0.88 pp vs baseline</text>
<path d="M340,318 H783.3 Q787.3,318 787.3,322 V366 Q787.3,370 783.3,370 H340 Z" fill="#eb6834"/>
