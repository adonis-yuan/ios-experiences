<text x="520.0" y="478" font-size="16" fill="#8a8984" text-anchor="middle">2%</text>
<line x1="700.0" y1="232" x2="700.0" y2="456" stroke="#e4e3df"/>
<text x="700.0" y="478" font-size="16" fill="#8a8984" text-anchor="middle">4%</text>
