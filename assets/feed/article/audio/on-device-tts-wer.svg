<rect width="1080" height="916" fill="#fcfcfb"/>
<text x="60" y="70" font-size="34" font-weight="700" fill="#0b0b0b">Word error rate: Kokoro matches the baseline</text>
<text x="60" y="118" font-size="20" fill="#52514e">215 paragraphs from 50 news articles, synthesized, then transcribed back with</text>
<text x="60" y="146" font-size="20" fill="#52514e">Whisper small.en. Lower is better on both charts.</text>
<text x="60" y="214" font-size="21" font-weight="700" fill="#0b0b0b">Word error rate</text>
