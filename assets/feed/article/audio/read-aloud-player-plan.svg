<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#3c4653"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
  </defs>
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430}
    .sub{font-size:12.5px;fill:#5d6875}
    .h{font-size:14px;font-weight:700;fill:#1b2430}
    .k{font-size:12.5px;fill:#26303c}
    .kb{font-size:12.5px;font-weight:700;fill:#1b2430}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#26303c}
    .monor{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#a5281b}
    .ln{stroke:#3c4653;stroke-width:1.5;marker-end:url(#ah)}
    .lnr{stroke:#c0392b;stroke-width:1.6;stroke-dasharray:6 4;marker-end:url(#ahr)}
  </style>
  <rect width="1080" height="560" fill="#fbfcfd"/>
  <text class="t" x="34" y="34">Read-aloud player: three layers, dependencies point down only</text>
  <text class="sub" x="34" y="55">The player is one module. The work is the bottom layer, which every other sound source in the app must go through.</text>

  <rect x="34" y="74" width="690" height="66" rx="8" fill="#eef1f5" stroke="#9aa6b4"/>
  <text class="h" x="50" y="98">① Article page (existing)</text>
  <text class="k" x="50" y="120">Top-bar button · reads the narration field · pauses body media on start · a body video tap closes read-aloud</text>
  <line class="ln" x1="380" y1="142" x2="380" y2="166"/>
  <text class="mono" x="390" y="159">startOrExpand(article)</text>

  <rect x="34" y="170" width="690" height="190" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text class="h" x="50" y="194">② Read-aloud module — lives for the process</text>
  <g>
    <rect x="50" y="208" width="210" height="62" rx="5" fill="#fff" stroke="#d5dbe3"/>
    <text class="mono" x="62" y="230">PlaybackController</text><text class="k" x="62" y="252">the only entry point</text>
    <rect x="272" y="208" width="210" height="62" rx="5" fill="#fff" stroke="#d5dbe3"/>
    <text class="mono" x="284" y="230">StateReducer</text><text class="k" x="284" y="252">pure; one render snapshot</text>
    <rect x="494" y="208" width="214" height="62" rx="5" fill="#fff" stroke="#d5dbe3"/>
    <text class="mono" x="506" y="230">Engine (AVPlayer)</text><text class="k" x="506" y="252">rate-based start; rebuilds</text>
    <rect x="50" y="282" width="210" height="62" rx="5" fill="#fff" stroke="#d5dbe3"/>
    <text class="mono" x="62" y="304">SessionPolicy</text><text class="k" x="62" y="326">interruptions, routes, re-promote</text>
    <rect x="272" y="282" width="210" height="62" rx="5" fill="#fff" stroke="#d5dbe3"/>
    <text class="mono" x="284" y="304">NowPlayingPublisher</text><text class="k" x="284" y="326">sole lock-screen writer</text>
    <rect x="494" y="282" width="214" height="62" rx="5" fill="#fff" stroke="#d5dbe3"/>
    <text class="mono" x="506" y="304">Overlay (bar + bubble)</text><text class="k" x="506" y="326">snapshot view; avoidance</text>
  </g>
  <line class="ln" x1="380" y1="362" x2="380" y2="386"/>
  <text class="mono" x="390" y="379">begin / end spoken session</text>

  <rect x="34" y="390" width="690" height="92" rx="8" fill="#e6eef7" stroke="#5b86b5"/>
  <text class="h" x="50" y="414">③ Contract layer (one file in the lowest shared library)</text>
  <text class="mono" x="50" y="440">SessionArbiter</text><text class="k" x="190" y="440">the only in-app session writer; user-initiated vs passive; unavailable to extensions</text>
  <text class="mono" x="50" y="464">App delegate</text><text class="k" x="190" y="464">injects each module's narrow protocol at launch; modules never reference the arbiter</text>

  <rect x="756" y="170" width="290" height="312" rx="8" fill="#e8f4ec" stroke="#3d8b57"/>
  <text class="h" x="772" y="194">Every other sound source</text>
  <text class="sub" x="772" y="212">each knows only its own protocol</text>
  <text class="k" x="772" y="236">Video tab · full-screen · short drama</text>
  <text class="k" x="772" y="256">Feed and related-video autoplay</text>
  <text class="k" x="772" y="276">Ads in articles, feed and radio card</text>
  <text class="k" x="772" y="296">Profile tab · community video</text>
  <text class="k" x="772" y="316">Radio · mini player · interstitials</text>
  <text class="k" x="772" y="336">Body media · recording · audio tab</text>
  <text class="monor" x="772" y="378">before playing → requestPlayback(kind)</text>
  <text class="monor" x="772" y="400">session writes → only via the arbiter</text>
  <text class="monor" x="772" y="422">read-aloud starts → yield</text>
  <line class="lnr" x1="754" y1="440" x2="728" y2="440"/>

  <rect x="34" y="500" width="1012" height="44" rx="6" fill="#f4f6f9" stroke="#d5dbe3"/>
  <text class="kb" x="50" y="527">What the picture is for</text>
  <text class="k" x="210" y="527">Playing audio is the middle box. Not being interrupted is the bottom box plus a lint rule — and that is where the estimate goes.</text>
</svg>
