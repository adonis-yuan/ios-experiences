<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#3c4653"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b06a00"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9aa4b0"/></marker>
  </defs>
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430}
    .sub{font-size:12.5px;fill:#5d6875}
    .lane{font-size:12.5px;font-weight:700;fill:#1b2430}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#26303c}
    .monor{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#a5281b}
    .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px}
    .k{font-size:12.5px;fill:#26303c}
    .kb{font-size:12.5px;font-weight:700;fill:#1b2430}
    .ln{stroke:#3c4653;stroke-width:1.5;marker-end:url(#ah)}
    .lnd{stroke:#b06a00;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#aha)}
    .lnrd{stroke:#c0392b;stroke-width:1.8;stroke-dasharray:5 4;fill:none;marker-end:url(#ahr)}
    .seq{stroke:#9aa4b0;stroke-width:1.2;fill:none;marker-end:url(#ahg)}
    .life{stroke:#b8c1cc;stroke-width:1.2;stroke-dasharray:3 4}
  </style>
  <rect width="1060" height="680" fill="#fbfcfd"/>

  <text class="t" x="34" y="34">Two Screen Time replies interleave inside one KVO change</text>
  <text class="sub" x="34" y="55">iOS 26.2–26.4: WebKit gives each observer a global concurrent queue, so replies for the same observer run in parallel.</text>

  <rect x="34" y="72" width="200" height="36" rx="5" fill="#eef1f5" stroke="#c4ccd6"/>
  <text class="lane" x="134" y="95" text-anchor="middle">ScreenTimeAgent (daemon)</text>
  <rect x="300" y="72" width="200" height="36" rx="5" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="lane" x="400" y="95" text-anchor="middle">Reply thread A</text>
  <rect x="540" y="72" width="200" height="36" rx="5" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="lane" x="640" y="95" text-anchor="middle">Reply thread B</text>
  <rect x="800" y="72" width="200" height="36" rx="5" fill="#eef1f5" stroke="#c4ccd6"/>
  <text class="lane" x="900" y="95" text-anchor="middle">Main thread (WebKit)</text>

  <line class="life" x1="134" y1="112" x2="134" y2="526"/>
  <line class="life" x1="400" y1="112" x2="400" y2="526"/>
  <line class="life" x1="640" y1="112" x2="640" y2="526"/>
  <line class="life" x1="900" y1="112" x2="900" y2="526"/>

  <line class="ln" x1="134" y1="142" x2="394" y2="142"/>
  <text class="mono" x="146" y="136">reply #1 (startup request)</text>

  <line class="lnd" x1="134" y1="180" x2="634" y2="180"/>
  <text class="mono" x="146" y="174">SettingsDidChange notify → request #2</text>

  <line class="ln" x1="134" y1="218" x2="634" y2="218"/>
  <text class="mono" x="146" y="212">reply #2, while #1 is still running</text>
  <text class="tag" x="146" y="234" fill="#8a5a00">WINDOW ≈ 10–20 MS ON A SIMULATOR</text>

  <rect x="300" y="248" width="200" height="44" rx="4" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="kb" x="400" y="266" text-anchor="middle">1  willChange</text>
  <text class="mono" x="400" y="283" text-anchor="middle">snapshot old = C0</text>

  <rect x="540" y="304" width="200" height="44" rx="4" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="kb" x="640" y="322" text-anchor="middle">2  willChange</text>
  <text class="mono" x="640" y="339" text-anchor="middle">snapshot old = C0</text>

  <rect x="300" y="360" width="200" height="44" rx="4" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="kb" x="400" y="378" text-anchor="middle">3  setConfiguration:</text>
  <text class="mono" x="400" y="395" text-anchor="middle">C1 (atomic, safe alone)</text>

  <rect x="540" y="416" width="200" height="44" rx="4" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="kb" x="640" y="434" text-anchor="middle">4  setConfiguration:</text>
  <text class="mono" x="640" y="451" text-anchor="middle">C2</text>

  <path class="seq" d="M500,276 L538,316"/>
  <path class="seq" d="M540,336 L502,374"/>
  <path class="seq" d="M500,388 L538,428"/>
  <path class="seq" d="M560,460 L512,470"/>

  <rect x="230" y="472" width="290" height="50" rx="4" fill="#fbe9e7" stroke="#d99a92"/>
  <text class="kb" x="375" y="491" text-anchor="middle">5  didChange: expects C0 → C1, finds C2</text>
  <text class="monor" x="375" y="510" text-anchor="middle">NSInternalInconsistencyException</text>

  <rect x="800" y="348" width="200" height="66" rx="4" fill="#fdf3e3" stroke="#dcbc86"/>
  <text class="tag" x="900" y="366" text-anchor="middle" fill="#8a5a00">SAME RACE, OTHER SIDE</text>
  <text class="mono" x="900" y="384" text-anchor="middle">stopObserving, then</text>
  <text class="mono" x="900" y="401" text-anchor="middle">removeObserver</text>
  <path class="lnrd" d="M800,404 L746,430"/>
  <text class="monor" x="772" y="452">collides with 4</text>

  <rect x="34" y="546" width="484" height="58" rx="6" fill="#fbe9e7" stroke="#d99a92"/>
  <text class="kb" x="50" y="568">iOS 26.2–26.4: replies on a global concurrent queue</text>
  <text class="k" x="50" y="588">Steps 1–5 of two replies interleave across threads → crash.</text>

  <rect x="542" y="546" width="484" height="58" rx="6" fill="#e3f1e6" stroke="#8fbf9a"/>
  <text class="kb" x="558" y="568">iOS 26.5 and the app-side workaround: one serial queue</text>
  <text class="k" x="558" y="588">Reply #1 finishes 1 → 3 → 5 before reply #2 starts.</text>

  <rect x="34" y="618" width="992" height="40" rx="6" fill="#f4f6f8" stroke="#c4ccd6"/>
  <text class="k" x="50" y="643">What the picture is for: an atomic property guards the store, not KVO's willChange / store / didChange around it.</text>
</svg>
