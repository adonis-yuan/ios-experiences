<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="866" viewBox="0 0 1080 866" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430} .sub{font-size:12.5px;fill:#5d6875}
    .ln{font-size:14px;font-weight:700;fill:#1b2430} .ls{font-size:11.5px;fill:#5d6875}
    .sh{font-size:12.5px;font-weight:700;fill:#3c4653} .al{font-size:12.5px;fill:#26303c}
    .nt{font-size:12.5px;fill:#26303c} .sd{font-size:12px;fill:#6b7684}
    .bt{font-size:13.5px;font-weight:700;fill:#1b2430} .bx{font-size:12.5px;fill:#26303c}
    .lg{font-size:12px;fill:#5d6875} .fn{font-size:13px;fill:#26303c}
  </style>
  <rect width="1080" height="866" fill="#fbfcfd"/>
  <text class="t" x="24" y="34">Changes to old pages: online clients get the broadcast, offline clients compare versions when they return</text>
  <rect x="16" y="164" width="1048" height="246" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="188">① While the change happens: broadcast over the long connection</text><rect x="16" y="418" width="1048" height="366" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="442">② Was offline: on return, compare versions page by page</text>
  <line x1="140" y1="120" x2="140" y2="784" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="25.0" y="74" width="230" height="46" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="140" y="103" text-anchor="middle">Client A (makes the change)</text><line x1="420" y1="120" x2="420" y2="784" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="320.0" y="74" width="200" height="46" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="420" y="103" text-anchor="middle">Server</text><line x1="680" y1="120" x2="680" y2="784" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="580.0" y="74" width="200" height="46" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="680" y="103" text-anchor="middle">Client B (online)</text><line x1="930" y1="120" x2="930" y2="784" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="830.0" y="74" width="200" height="46" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="930" y="103" text-anchor="middle">Client C (offline)</text>
  <text class="sd" x="920" y="226" text-anchor="end"></text><text class="al" x="280.0" y="219" text-anchor="middle">delete_msg / react</text><line x1="140" y1="226" x2="412" y2="226" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="420,226 410,221 410,231" fill="#7d8793"/><rect x="295.0" y="250" width="250" height="32" rx="7" fill="#ffffff" stroke="#9aa3ad"/><text class="nt" x="420.0" y="271" text-anchor="middle">page mver + 1, or rver updated</text><text class="al" x="550.0" y="299" text-anchor="middle">msg_update (new mver)</text><line x1="420" y1="306" x2="672" y2="306" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="680,306 670,301 670,311" fill="#8d97a3"/><text class="sd" x="920" y="346" text-anchor="end">offline, receives nothing</text><text class="al" x="550.0" y="339" text-anchor="middle">reaction_delta (rseq)</text><line x1="420" y1="346" x2="672" y2="346" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="680,346 670,341 670,351" fill="#8d97a3"/><rect x="535.0" y="370" width="290" height="32" rx="7" fill="#ffffff" stroke="#9aa3ad"/><text class="nt" x="680.0" y="391" text-anchor="middle">persist if it has this message, update UI</text><text class="al" x="675.0" y="473" text-anchor="middle">subscribe</text><line x1="930" y1="480" x2="428" y2="480" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="420,480 430,475 430,485" fill="#7d8793"/><text class="al" x="675.0" y="513" text-anchor="middle">snapshot (per-page mver / rver)</text><line x1="420" y1="520" x2="922" y2="520" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="930,520 920,515 920,525" fill="#8d97a3"/><rect x="778" y="544" width="290" height="32" rx="7" fill="#ffffff" stroke="#9aa3ad"/><text class="nt" x="923.0" y="565" text-anchor="middle">reaches a cached old page, shows it first</text><text class="al" x="675.0" y="593" text-anchor="middle">page_sync (known mver / rver for this page)</text><line x1="930" y1="600" x2="428" y2="600" stroke="#3b6fd6" stroke-width="2.6" stroke-dasharray=""/><polygon points="420,600 430,595 430,605" fill="#3b6fd6"/><text class="al" x="675.0" y="633" text-anchor="middle">page_sync_result (new versions + changed messages / reactions)</text><line x1="420" y1="640" x2="922" y2="640" stroke="#3b6fd6" stroke-width="2.6" stroke-dasharray="7 5"/><polygon points="930,640 920,635 920,645" fill="#3b6fd6"/><text class="al" x="675.0" y="673" text-anchor="middle">page not cached: page_sync (known version 0)</text><line x1="930" y1="680" x2="428" y2="680" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="420,680 430,675 430,685" fill="#7d8793"/><text class="al" x="675.0" y="713" text-anchor="middle">full page + reaction summaries</text><line x1="420" y1="720" x2="922" y2="720" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="930,720 920,715 920,725" fill="#8d97a3"/><rect x="830.0" y="744" width="200" height="32" rx="7" fill="#ffffff" stroke="#9aa3ad"/><text class="nt" x="930.0" y="765" text-anchor="middle">persist, UI follows</text>
  
  <line x1="30" y1="818" x2="76" y2="818" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><text class="lg" x="86" y="822">sent by a client</text><line x1="221.2" y1="818" x2="267.2" y2="818" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><text class="lg" x="277.2" y="822">sent by the server</text><line x1="426.79999999999995" y1="818" x2="472.79999999999995" y2="818" stroke="#3b6fd6" stroke-width="2.6" stroke-dasharray=""/><text class="lg" x="482.79999999999995" y="822">version check (long connection)</text>
</svg>