<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="2146" viewBox="0 0 1030 2146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430} .sub{font-size:12.5px;fill:#5d6875}
    .ln{font-size:14px;font-weight:700;fill:#1b2430} .ls{font-size:11.5px;fill:#5d6875}
    .sh{font-size:12.5px;font-weight:700;fill:#3c4653} .al{font-size:12.5px;fill:#26303c}
    .nt{font-size:12.5px;fill:#26303c} .sd{font-size:12px;fill:#6b7684}
    .bt{font-size:13.5px;font-weight:700;fill:#1b2430} .bx{font-size:12.5px;fill:#26303c}
    .lg{font-size:12px;fill:#5d6875} .fn{font-size:13px;fill:#26303c}
  </style>
  <rect width="1030" height="2146" fill="#fbfcfd"/>
  <text class="t" x="24" y="34">The UI reads only from the local store: everything is persisted before the screen refreshes</text>
  <rect x="16" y="164" width="998" height="326" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="188">Sending my own message</text><rect x="16" y="498" width="998" height="166" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="522">Receiving someone else’s message</text><rect x="16" y="672" width="998" height="326" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="696">I add or remove a reaction</text><rect x="16" y="1006" width="998" height="166" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="1030">Someone else reacts, or a message is deleted</text><rect x="16" y="1180" width="998" height="326" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="1204">I delete one of my own messages</text><rect x="16" y="1514" width="998" height="406" rx="9" fill="#f1f2ef"/><text class="sh" x="30" y="1538">Scrolling: show local data first, verify with the server in parallel</text>
  <line x1="130" y1="120" x2="130" y2="1920" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="20.0" y="62" width="220" height="58" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="130" y="86" text-anchor="middle">UI layer</text><text class="ls" x="130" y="106" text-anchor="middle">native views + view model</text><line x1="385" y1="120" x2="385" y2="1920" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="275.0" y="62" width="220" height="58" rx="10" fill="#e8eefb" stroke="#3b6fd6" stroke-width="1.5"/><text class="ln" x="385" y="86" text-anchor="middle">Local store</text><text class="ls" x="385" y="106" text-anchor="middle">SQLite, single source of truth</text><line x1="640" y1="120" x2="640" y2="1920" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="530.0" y="62" width="220" height="58" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="640" y="86" text-anchor="middle">Transport layer</text><text class="ls" x="640" y="106" text-anchor="middle">WebSocket connection</text><line x1="895" y1="120" x2="895" y2="1920" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="785.0" y="62" width="220" height="58" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="895" y="86" text-anchor="middle">Server</text><text class="ls" x="895" y="106" text-anchor="middle">live room gateway</text>
  <text class="al" x="257.5" y="219" text-anchor="middle">write pending (sending)</text><line x1="130" y1="226" x2="377" y2="226" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,226 375,221 375,231" fill="#7d8793"/><text class="al" x="257.5" y="259" text-anchor="middle">change event: show “sending”</text><line x1="385" y1="266" x2="138" y2="266" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,266 140,261 140,271" fill="#9aa3ad"/><text class="al" x="512.5" y="299" text-anchor="middle">hand to send queue</text><line x1="385" y1="306" x2="632" y2="306" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="640,306 630,301 630,311" fill="#7d8793"/><text class="al" x="767.5" y="339" text-anchor="middle">send (client_msg_id)</text><line x1="640" y1="346" x2="887" y2="346" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="895,346 885,341 885,351" fill="#8d97a3"/><text class="al" x="767.5" y="379" text-anchor="middle">send_ack (msg_id, seq)</text><line x1="895" y1="386" x2="648" y2="386" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,386 650,381 650,391" fill="#8d97a3"/><text class="al" x="512.5" y="419" text-anchor="middle">txn: pending → messages</text><line x1="640" y1="426" x2="393" y2="426" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,426 395,421 395,431" fill="#7d8793"/><text class="al" x="257.5" y="459" text-anchor="middle">change event: move to its seq position</text><line x1="385" y1="466" x2="138" y2="466" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,466 140,461 140,471" fill="#9aa3ad"/><text class="al" x="767.5" y="553" text-anchor="middle">msg_new (someone else’s)</text><line x1="895" y1="560" x2="648" y2="560" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,560 650,555 650,565" fill="#8d97a3"/><text class="al" x="512.5" y="593" text-anchor="middle">dedupe, merge by ver, persist</text><line x1="640" y1="600" x2="393" y2="600" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,600 395,595 395,605" fill="#7d8793"/><text class="al" x="257.5" y="633" text-anchor="middle">change event → diff refresh</text><line x1="385" y1="640" x2="138" y2="640" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,640 140,635 140,645" fill="#9aa3ad"/><text class="al" x="257.5" y="727" text-anchor="middle">apply locally: count ±1</text><line x1="130" y1="734" x2="377" y2="734" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,734 375,729 375,739" fill="#7d8793"/><text class="al" x="257.5" y="767" text-anchor="middle">change event: refresh this cell</text><line x1="385" y1="774" x2="138" y2="774" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,774 140,769 140,779" fill="#9aa3ad"/><text class="al" x="512.5" y="807" text-anchor="middle">hand to send queue</text><line x1="385" y1="814" x2="632" y2="814" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="640,814 630,809 630,819" fill="#7d8793"/><text class="al" x="767.5" y="847" text-anchor="middle">react (add / remove)</text><line x1="640" y1="854" x2="887" y2="854" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="895,854 885,849 885,859" fill="#8d97a3"/><text class="al" x="767.5" y="887" text-anchor="middle">react_ack / react_reject</text><line x1="895" y1="894" x2="648" y2="894" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,894 650,889 650,899" fill="#8d97a3"/><text class="al" x="512.5" y="927" text-anchor="middle">record ts; roll back if rejected</text><line x1="640" y1="934" x2="393" y2="934" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,934 395,929 395,939" fill="#7d8793"/><text class="al" x="257.5" y="967" text-anchor="middle">on rollback, refresh the cell again</text><line x1="385" y1="974" x2="138" y2="974" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,974 140,969 140,979" fill="#9aa3ad"/><text class="al" x="767.5" y="1061" text-anchor="middle">reaction_delta / msg_update</text><line x1="895" y1="1068" x2="648" y2="1068" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,1068 650,1063 650,1073" fill="#8d97a3"/><text class="al" x="512.5" y="1101" text-anchor="middle">merge by ts / ver, persist</text><line x1="640" y1="1108" x2="393" y2="1108" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,1108 395,1103 395,1113" fill="#7d8793"/><text class="al" x="257.5" y="1141" text-anchor="middle">refresh only the affected cells</text><line x1="385" y1="1148" x2="138" y2="1148" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,1148 140,1143 140,1153" fill="#9aa3ad"/><text class="al" x="257.5" y="1235" text-anchor="middle">mark deleted locally first</text><line x1="130" y1="1242" x2="377" y2="1242" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,1242 375,1237 375,1247" fill="#7d8793"/><text class="al" x="257.5" y="1275" text-anchor="middle">change event: show “message deleted”</text><line x1="385" y1="1282" x2="138" y2="1282" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,1282 140,1277 140,1287" fill="#9aa3ad"/><text class="al" x="512.5" y="1315" text-anchor="middle">hand to send queue</text><line x1="385" y1="1322" x2="632" y2="1322" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="640,1322 630,1317 630,1327" fill="#7d8793"/><text class="al" x="767.5" y="1355" text-anchor="middle">delete_msg (msg_id)</text><line x1="640" y1="1362" x2="887" y2="1362" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="895,1362 885,1357 885,1367" fill="#8d97a3"/><text class="al" x="767.5" y="1395" text-anchor="middle">msg_update (deleted, ver+1)</text><line x1="895" y1="1402" x2="648" y2="1402" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,1402 650,1397 650,1407" fill="#8d97a3"/><text class="al" x="512.5" y="1435" text-anchor="middle">overwrite by ver; restore on failure</text><line x1="640" y1="1442" x2="393" y2="1442" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,1442 395,1437 395,1447" fill="#7d8793"/><text class="al" x="257.5" y="1475" text-anchor="middle">on failure, restore the original</text><line x1="385" y1="1482" x2="138" y2="1482" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,1482 140,1477 140,1487" fill="#9aa3ad"/><text class="al" x="257.5" y="1569" text-anchor="middle">20 from the oldest: prefetch previous page</text><line x1="130" y1="1576" x2="377" y2="1576" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,1576 375,1571 375,1581" fill="#7d8793"/><text class="al" x="257.5" y="1609" text-anchor="middle">return the cached page first</text><line x1="385" y1="1616" x2="138" y2="1616" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,1616 140,1611 140,1621" fill="#9aa3ad"/><text class="al" x="512.5" y="1649" text-anchor="middle">page unverified this session: check it</text><line x1="385" y1="1656" x2="632" y2="1656" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="640,1656 630,1651 630,1661" fill="#7d8793"/><text class="al" x="767.5" y="1689" text-anchor="middle">page_sync (mver, rver)</text><line x1="640" y1="1696" x2="887" y2="1696" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="895,1696 885,1691 885,1701" fill="#8d97a3"/><text class="al" x="767.5" y="1729" text-anchor="middle">current versions + message / reaction deltas</text><line x1="895" y1="1736" x2="648" y2="1736" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,1736 650,1731 650,1741" fill="#8d97a3"/><text class="al" x="767.5" y="1769" text-anchor="middle">page not cached: page_sync (version 0)</text><line x1="640" y1="1776" x2="887" y2="1776" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="895,1776 885,1771 885,1781" fill="#8d97a3"/><text class="al" x="767.5" y="1809" text-anchor="middle">full page + reaction summaries</text><line x1="895" y1="1816" x2="648" y2="1816" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="640,1816 650,1811 650,1821" fill="#8d97a3"/><text class="al" x="512.5" y="1849" text-anchor="middle">merge messages by ver, apply reaction deltas</text><line x1="640" y1="1856" x2="393" y2="1856" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="385,1856 395,1851 395,1861" fill="#7d8793"/><text class="al" x="257.5" y="1889" text-anchor="middle">refresh only the cells that changed</text><line x1="385" y1="1896" x2="138" y2="1896" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><polygon points="130,1896 140,1891 140,1901" fill="#9aa3ad"/>
  
  <line x1="30" y1="1954" x2="76" y2="1954" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><text class="lg" x="86" y="1958">local call</text><line x1="178.0" y1="1954" x2="224.0" y2="1954" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><text class="lg" x="234.0" y="1958">WebSocket frame</text><line x1="362.0" y1="1954" x2="408.0" y2="1954" stroke="#9aa3ad" stroke-width="1.4" stroke-dasharray="2 4"/><text class="lg" x="418.0" y="1958">store change notification</text><text class="fn" x="30" y="1998">1. A message being sent is written to pending first and shows immediately, without waiting for the server.</text><text class="fn" x="30" y="2022">2. On send_ack it moves into messages in one transaction, and the UI moves it to its seq position.</text><text class="fn" x="30" y="2046">3. The UI never consumes network responses directly; it only subscribes to store change events.</text><text class="fn" x="30" y="2070">4. Reactions and deletes change an existing cell’s content; the diff refreshes that item and order is unchanged.</text><text class="fn" x="30" y="2094">5. My own actions apply locally first and roll back if the server rejects them; deleted messages keep a placeholder.</text><text class="fn" x="30" y="2118">6. When scrolling, show local data, then compare versions with page_sync; unchanged pages return only versions.</text>
</svg>