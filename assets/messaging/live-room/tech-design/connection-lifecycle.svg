<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1070" viewBox="0 0 900 1070" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430} .sub{font-size:12.5px;fill:#5d6875}
    .ln{font-size:14px;font-weight:700;fill:#1b2430} .ls{font-size:11.5px;fill:#5d6875}
    .sh{font-size:12.5px;font-weight:700;fill:#3c4653} .al{font-size:12.5px;fill:#26303c}
    .nt{font-size:12.5px;fill:#26303c} .sd{font-size:12px;fill:#6b7684}
    .bt{font-size:13.5px;font-weight:700;fill:#1b2430} .bx{font-size:12.5px;fill:#26303c}
    .lg{font-size:12px;fill:#5d6875} .fn{font-size:13px;fill:#26303c}
  </style>
  <rect width="900" height="1070" fill="#fbfcfd"/>
  <text class="t" x="24" y="34">Connect on entering, disconnect on leaving or backgrounding, reconnect at most 3 times</text>
  <rect x="16" y="164" width="868" height="246" rx="9" fill="#f1f2ef"/><text class="sh" x="870" y="188" text-anchor="end">① Connect</text><rect x="16" y="418" width="868" height="326" rx="9" fill="#f1f2ef"/><text class="sh" x="870" y="442" text-anchor="end">② In the room</text><rect x="16" y="752" width="868" height="126" rx="9" fill="#f1f2ef"/><text class="sh" x="870" y="776" text-anchor="end">③ Disconnect</text>
  <line x1="150" y1="120" x2="150" y2="878" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="30.0" y="74" width="240" height="46" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="150" y="103" text-anchor="middle">Client (iOS / Android)</text><line x1="720" y1="120" x2="720" y2="878" stroke="#b4bbc3" stroke-width="1.2" stroke-dasharray=""/><rect x="600.0" y="74" width="240" height="46" rx="10" fill="#ffffff" stroke="#8d97a3" stroke-width="1.5"/><text class="ln" x="720" y="103" text-anchor="middle">Long-connection server</text>
  <text class="al" x="435.0" y="219" text-anchor="middle">WSS handshake (HTTP Upgrade), on entering or returning to foreground</text><line x1="150" y1="226" x2="712" y2="226" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,226 710,221 710,231" fill="#7d8793"/><text class="al" x="435.0" y="259" text-anchor="middle">hello (first frame after connecting)</text><line x1="150" y1="266" x2="712" y2="266" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,266 710,261 710,271" fill="#7d8793"/><text class="al" x="435.0" y="299" text-anchor="middle">welcome</text><line x1="720" y1="306" x2="158" y2="306" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,306 160,301 160,311" fill="#8d97a3"/><text class="al" x="435.0" y="339" text-anchor="middle">subscribe(latest_n = 50, known_pseq)</text><line x1="150" y1="346" x2="712" y2="346" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,346 710,341 710,351" fill="#7d8793"/><text class="al" x="435.0" y="379" text-anchor="middle">snapshot (at least 50 messages + page_versions)</text><line x1="720" y1="386" x2="158" y2="386" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,386 160,381 160,391" fill="#8d97a3"/><text class="al" x="435.0" y="473" text-anchor="middle">send · react · delete_msg · vote</text><line x1="150" y1="480" x2="712" y2="480" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,480 710,475 710,485" fill="#7d8793"/><text class="al" x="435.0" y="513" text-anchor="middle">send_ack · react_ack · *_reject</text><line x1="720" y1="520" x2="158" y2="520" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,520 160,515 160,525" fill="#8d97a3"/><text class="al" x="435.0" y="553" text-anchor="middle">msg_new · msg_update · reaction_delta · host_new · stats</text><line x1="720" y1="560" x2="158" y2="560" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,560 160,555 160,565" fill="#8d97a3"/><text class="al" x="435.0" y="593" text-anchor="middle">page_sync (on reaching an older page)</text><line x1="150" y1="600" x2="712" y2="600" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,600 710,595 710,605" fill="#7d8793"/><text class="al" x="435.0" y="633" text-anchor="middle">page_sync_result</text><line x1="720" y1="640" x2="158" y2="640" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,640 160,635 160,645" fill="#8d97a3"/><text class="al" x="435.0" y="673" text-anchor="middle">ping (about every 25 s)</text><line x1="150" y1="680" x2="712" y2="680" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,680 710,675 710,685" fill="#7d8793"/><text class="al" x="435.0" y="713" text-anchor="middle">pong (carries server_ts)</text><line x1="720" y1="720" x2="158" y2="720" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,720 160,715 160,725" fill="#8d97a3"/><text class="al" x="435.0" y="807" text-anchor="middle">close: leaving the room or backgrounding, client-initiated</text><line x1="150" y1="814" x2="712" y2="814" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><polygon points="720,814 710,809 710,819" fill="#7d8793"/><text class="al" x="435.0" y="847" text-anchor="middle">error (KICKED / OVERLOADED + retry_after_sec), then close</text><line x1="720" y1="854" x2="158" y2="854" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><polygon points="150,854 160,849 160,859" fill="#8d97a3"/><rect x="40" y="896" width="700" height="76" rx="9" fill="#e8eefb" stroke="#3b6fd6" stroke-width="1.6"/><text class="bt" x="60" y="920">Abnormal network drop</text><text class="bx" x="60" y="942">Back off 5 / 15 / 45 s (each ±30% jitter), at most 3 times.</text><text class="bx" x="60" y="962">Each retry restarts from the handshake; if all fail, mark disconnected and offer retry above the composer.</text>
  <polyline points="40,934.0 26,934.0 26,226 140,226" fill="none" stroke="#3b6fd6" stroke-width="1.6"/><polygon points="150,226 140,221 140,231" fill="#3b6fd6"/>
  <line x1="30" y1="1022" x2="76" y2="1022" stroke="#7d8793" stroke-width="1.4" stroke-dasharray=""/><text class="lg" x="86" y="1026">sent by the client</text><line x1="235.6" y1="1022" x2="281.6" y2="1022" stroke="#8d97a3" stroke-width="1.4" stroke-dasharray="7 5"/><text class="lg" x="291.6" y="1026">sent by the server (reply or push)</text>
</svg>