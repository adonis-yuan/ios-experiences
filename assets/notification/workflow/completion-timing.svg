<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="742" viewBox="0 0 1060 742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#3c4653"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="aha" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b06a00"/></marker>
  </defs>
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430}
    .sub{font-size:12.5px;fill:#5d6875}
    .lane{font-size:12.5px;font-weight:700;fill:#1b2430}
    .msg{font-size:12px;fill:#26303c}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#26303c}
    .monor{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#a5281b}
    .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px}
    .k{font-size:12.5px;fill:#26303c}
    .kb{font-size:12.5px;font-weight:700;fill:#1b2430}
    .ln{stroke:#3c4653;stroke-width:1.5;marker-end:url(#ah)}
    .lnd{stroke:#b06a00;stroke-width:1.5;stroke-dasharray:6 4;marker-end:url(#aha)}
    .lnr{stroke:#c0392b;stroke-width:2;marker-end:url(#ahr)}
    .lnrd{stroke:#c0392b;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#ahr)}
    .life{stroke:#b8c1cc;stroke-width:1.2;stroke-dasharray:3 4}
  </style>
  <rect width="1060" height="742" fill="#fbfcfd"/>

  <text class="t" x="34" y="34">Revoking a delivered notification: initiating the removal is not completing it</text>
  <text class="sub" x="34" y="55">Calling the fetch completion handler tells the system the background work is done. It believes you.</text>

  <rect x="34" y="72" width="212" height="36" rx="5" fill="#eef1f5" stroke="#c4ccd6"/>
  <text class="lane" x="140" y="95" text-anchor="middle">System / APNS</text>
  <rect x="374" y="72" width="248" height="36" rx="5" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="lane" x="498" y="95" text-anchor="middle">App process</text>
  <rect x="768" y="72" width="252" height="36" rx="5" fill="#eef1f5" stroke="#c4ccd6"/>
  <text class="lane" x="894" y="95" text-anchor="middle">Notification service</text>

  <line class="life" x1="140" y1="112" x2="140" y2="470"/>
  <line class="life" x1="498" y1="112" x2="498" y2="470"/>
  <line class="life" x1="894" y1="112" x2="894" y2="470"/>

  <line class="ln" x1="140" y1="146" x2="492" y2="146"/>
  <text class="mono" x="150" y="140">didReceiveRemoteNotification — silent push, app woken</text>

  <line class="ln" x1="498" y1="200" x2="888" y2="200"/>
  <text class="mono" x="512" y="194">removeDeliveredNotifications(withIdentifiers:)</text>
  <text class="sub" x="512" y="214">returns at once; the work continues in another process</text>

  <line class="lnr" x1="492" y1="256" x2="146" y2="256"/>
  <text class="monor" x="196" y="250">completionHandler(.newData)</text>
  <text class="tag" x="196" y="270" fill="#a5281b">TOO EARLY — NOTHING HAS BEEN REMOVED YET</text>

  <line class="lnd" x1="140" y1="316" x2="492" y2="316"/>
  <text class="mono" x="150" y="310">background runtime withdrawn, app suspended</text>

  <line class="lnrd" x1="894" y1="374" x2="504" y2="374"/>
  <text class="monor" x="560" y="368">removal acknowledged</text>
  <text class="tag" x="560" y="388" fill="#a5281b">NO ONE LEFT TO RECEIVE THE REPLY</text>

  <rect x="374" y="416" width="248" height="34" rx="4" fill="#fbe9e7" stroke="#d99a92"/>
  <text class="msg" x="498" y="438" text-anchor="middle" fill="#a5281b" font-size="11.5">notification stays in Notification Center</text>

  <rect x="34" y="490" width="480" height="92" rx="6" fill="#fbe9e7" stroke="#d99a92"/>
  <text class="kb" x="50" y="512">Why it looks intermittent</text>
  <text class="k" x="50" y="532">It is a race against process suspension, so it depends on how</text>
  <text class="k" x="50" y="550">busy the device is. A deterministic cause — a missing identifier,</text>
  <text class="k" x="50" y="568">say — would fail every time, not sometimes.</text>

  <rect x="540" y="490" width="486" height="92" rx="6" fill="#e3f1e6" stroke="#8fbf9a"/>
  <text class="kb" x="556" y="512">The fix</text>
  <text class="k" x="556" y="532">Wait for the removal to be acknowledged, then report. Put the</text>
  <text class="k" x="556" y="550">completion call in a defer at the top of the handler so no early</text>
  <text class="k" x="556" y="568">return, and no error branch, can skip it.</text>

  <line x1="34" y1="606" x2="1026" y2="606" stroke="#d5dce4"/>
  <text class="kb" x="34" y="632">What the picture is for</text>
  <text class="k" x="34" y="654">• The documented contract is to call the block once processing has finished — not once it has been started.</text>
  <text class="k" x="34" y="676">• The failing path is silent: the success log is written inside the success callback, which is exactly what never runs.</text>
  <text class="k" x="34" y="698">• Only a real device with a real silent push exercises this. A simulator push injection does not take this code path.</text>
  <text class="k" x="34" y="720">• Solid = normal flow · dashed amber = system-initiated · dashed red = a reply that arrives too late to matter.</text>
</svg>
