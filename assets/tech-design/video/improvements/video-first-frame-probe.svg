<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="690" viewBox="0 0 1060 690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#3c4653"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
  </defs>
  <style>
    .t{font-size:19px;font-weight:700;fill:#1b2430}
    .sub{font-size:12.5px;fill:#5d6875}
    .lane{font-size:12.5px;font-weight:700;fill:#1b2430}
    .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#26303c}
    .monor{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#a5281b}
    .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px}
    .k{font-size:12.5px;fill:#26303c}
    .kb{font-size:12.5px;font-weight:700;fill:#1b2430}
    .ln{stroke:#3c4653;stroke-width:1.5;fill:none;marker-end:url(#ah)}
    .lnr{stroke:#c0392b;stroke-width:2;fill:none;marker-end:url(#ahr)}
    .lnx{stroke:#c0392b;stroke-width:1.8;stroke-dasharray:6 4;fill:none}
    .life{stroke:#b8c1cc;stroke-width:1.2;stroke-dasharray:3 4}
  </style>
  <rect width="1060" height="690" fill="#fbfcfd"/>

  <text class="t" x="34" y="34">The cache decision runs on the empty initial value</text>
  <text class="sub" x="34" y="55">Subscribing to a @Published property delivers its current value first. The real bytes arrive after everyone has stopped listening.</text>

  <rect x="50" y="72" width="200" height="36" rx="5" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="lane" x="150" y="95" text-anchor="middle">Player (cache decision)</text>
  <rect x="320" y="72" width="200" height="36" rx="5" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="lane" x="420" y="95" text-anchor="middle">Probe loader (@Published)</text>
  <rect x="580" y="72" width="200" height="36" rx="5" fill="#e6eef7" stroke="#a9c2dc"/>
  <text class="lane" x="680" y="95" text-anchor="middle">Sink on main queue</text>
  <rect x="830" y="72" width="190" height="36" rx="5" fill="#eef1f5" stroke="#c4ccd6"/>
  <text class="lane" x="925" y="95" text-anchor="middle">AVFoundation</text>

  <line class="life" x1="150" y1="112" x2="150" y2="560"/>
  <line class="life" x1="420" y1="112" x2="420" y2="560"/>
  <line class="life" x1="680" y1="112" x2="680" y2="560"/>
  <line class="life" x1="925" y1="112" x2="925" y2="560"/>

  <line class="ln" x1="150" y1="140" x2="414" y2="140"/>
  <text class="mono" x="160" y="134">start probe: Range bytes=0-1023</text>

  <line class="ln" x1="150" y1="180" x2="674" y2="180"/>
  <text class="mono" x="160" y="174">$buffer.receive(on: .main).sink { … }</text>

  <line class="lnr" x1="420" y1="222" x2="674" y2="222"/>
  <text class="monor" x="430" y="216">current value: Data()  (0 bytes)</text>
  <text class="tag" x="430" y="238" fill="#a5281b">DELIVERED ON SUBSCRIBE</text>

  <rect x="578" y="252" width="204" height="30" rx="4" fill="#fdecea" stroke="#e3a59d"/>
  <text class="monor" x="680" y="272" text-anchor="middle">isFaststart(0 bytes) → false</text>

  <line class="lnr" x1="680" y1="306" x2="156" y2="306"/>
  <text class="monor" x="300" y="300">"not faststart"</text>

  <line class="ln" x1="150" y1="344" x2="919" y2="344"/>
  <text class="mono" x="160" y="338">AVURLAsset(url:) — default path: no disk cache, own network stack</text>

  <rect x="52" y="364" width="196" height="30" rx="4" fill="#f4f6f8" stroke="#c4ccd6"/>
  <text class="mono" x="150" y="384" text-anchor="middle">cancellables.removeAll()</text>

  <rect x="322" y="414" width="196" height="46" rx="4" fill="#f4f6f8" stroke="#c4ccd6"/>
  <text class="k" x="420" y="433" text-anchor="middle">first ~1 KB arrives</text>
  <text class="sub" x="420" y="451" text-anchor="middle">after a ~530 ms cold handshake</text>

  <line class="lnx" x1="420" y1="490" x2="660" y2="490"/>
  <path d="M652,482 L668,498 M668,482 L652,498" stroke="#c0392b" stroke-width="2.4" fill="none"/>
  <text class="monor" x="430" y="484">buffer = first 1 KB</text>
  <text class="tag" x="430" y="508" fill="#a5281b">NO SUBSCRIBER LEFT</text>

  <rect x="290" y="522" width="260" height="30" rx="4" fill="#fdf3e3" stroke="#dcbc86"/>
  <text class="k" x="420" y="542" text-anchor="middle">still writes a 1 KB partial file + metadata</text>

  <rect x="34" y="578" width="992" height="92" rx="6" fill="#f1f4f8" stroke="#d3dae3"/>
  <text class="kb" x="52" y="602">What the picture is for</text>
  <text class="k" x="52" y="624">The check never sees real bytes, so every mp4 takes the default path — even when a full cached copy is already on disk.</text>
  <text class="k" x="52" y="644">Reads from the cache stay at zero while writes continue. Fix: skip the initial value (e.g. drop the first, or filter empty) and decide</text>
  <text class="k" x="52" y="662">on real data. Solid = normal call, red = the defect, dashed with X = a delivery nobody receives.</text>
</svg>
